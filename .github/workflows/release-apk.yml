name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Decode keystore and create keystore.properties
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.jks
          echo "storeFile=${{ github.workspace }}/release.jks" > ${{ github.workspace }}/keystore.properties
          echo "storePassword=$KEY_STORE_PASSWORD" >> ${{ github.workspace }}/keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> ${{ github.workspace }}/keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> ${{ github.workspace }}/keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify keystore.properties
        run: |
          echo "=== keystore.properties content ==="
          cat ${{ github.workspace }}/keystore.properties
          echo "=== release.jks size ==="
          wc -c ${{ github.workspace }}/release.jks

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler

      - name: Push to Itch.io
        run: |
          ./butler push app/build/outputs/apk/release/*.apk \
            doom-hamsters/doom-hamsters:android \
            --userversion ${{ github.ref_name }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
